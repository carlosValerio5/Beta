[project]
name = "beta-api"
version = "0.1.0"
description = "Beta Climbing HTTP API (FastAPI composition root)."
requires-python = ">=3.12"
dependencies = [
  "beta-core",
  "beta-vision",
  "beta-llm",
  "beta-data",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
]

[project.scripts]
beta-api = "beta_api.__main__:main"

[tool.uv.sources]
beta-core = { workspace = true }
beta-vision = { workspace = true }
beta-llm = { workspace = true }
beta-data = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
