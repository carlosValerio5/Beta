[project]
name = "beta-data"
version = "0.1.0"
description = "Beta Climbing medallion lakehouse: bronze writers, silver/gold jobs, contracts, lineage."
requires-python = ">=3.12"
dependencies = [
  "beta-core",
  "beta-vision",
  "pyarrow>=17",
  "duckdb>=1.1",
  "typer>=0.12",
]

[project.scripts]
beta-data = "beta_data.cli:app"

[tool.uv.sources]
beta-core = { workspace = true }
beta-vision = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
