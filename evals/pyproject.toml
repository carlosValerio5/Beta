[project]
name = "beta-evals"
version = "0.1.0"
description = "Beta Climbing evaluation harness over the golden set."
requires-python = ">=3.12"
dependencies = [
  "beta-core",
  "beta-vision",
  "beta-llm",
  "typer>=0.12",
]

[project.scripts]
beta-eval = "beta_evals.cli:app"

[tool.uv.sources]
beta-core = { workspace = true }
beta-vision = { workspace = true }
beta-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
