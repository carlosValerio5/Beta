[project]
name = "beta-workspace"
version = "0.1.0"
description = "Beta Climbing monorepo: workspace root (not a distributable package)."
requires-python = ">=3.12"
dependencies = [
  "beta-core",
  "beta-vision",
  "beta-llm",
  "beta-data",
  "beta-api",
  "beta-evals",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/vision",
  "packages/llm",
  "packages/data",
  "apps/api",
  "evals",
]

[tool.uv.sources]
beta-core = { workspace = true }
beta-vision = { workspace = true }
beta-llm = { workspace = true }
beta-data = { workspace = true }
beta-api = { workspace = true }
beta-evals = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "pre-commit>=3.8",
]
docs = ["mkdocs-material>=9.5"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/renderer", "apps/ios", "data", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "PT", "C4", "PL", "TID"]
ignore = [
  "E501",    # ruff format owns line length; long strings/URLs are fine
  "PLR0913", # use cases take their ports explicitly; long ctor arg lists are intentional
  "PLR2004", # magic numbers are fine in tests and anthropometric tables
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "S101", "PLR0915", "N802"]
"packages/vision/**" = ["TID251"] # the one package allowed to import OpenCV
"packages/llm/**" = ["TID251"]    # the one package allowed to import the Anthropic SDK

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The domain core must stay free of I/O and adapter dependencies (see ADR-0002).
"cv2".msg = "Import OpenCV only in beta_vision."
"anthropic".msg = "Import the Anthropic SDK only in beta_llm."

[tool.ruff.lint.isort]
known-first-party = ["beta_core", "beta_vision", "beta_llm", "beta_data", "beta_api", "beta_evals"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "packages/core/src",
  "packages/vision/src",
  "packages/llm/src",
  "packages/data/src",
  "apps/api/src",
  "evals/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "pyarrow", "pyarrow.*", "duckdb"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q --strict-markers"
testpaths = [
  "packages/core/tests",
  "packages/vision/tests",
  "packages/llm/tests",
  "packages/data/tests",
  "apps/api/tests",
  "evals/tests",
]
markers = [
  "live: calls real external services (Anthropic, renderer); skipped unless BETA_LIVE=1",
]

[tool.coverage.run]
branch = true
source = ["beta_core", "beta_vision", "beta_llm", "beta_data", "beta_api", "beta_evals"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
